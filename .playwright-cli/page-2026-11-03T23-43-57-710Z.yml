                    - heading "Вопросы" [level=2] [ref=e356]
                - generic [ref=e357]:
                    - generic [ref=e358]:
                        - button "Чем заказ отличается от оплаты?" [expanded] [ref=e359] [cursor=pointer]
                        - paragraph [ref=e364]: 'Заказ — это цель в Метрике: заявка оставлена, переход к оплате начат. Оплата — фактически купленный билет: B2B-сделка в кабинете или подтверждённая оплата B2C. KPI «300 оплат» считается только по оплаченным, заказы показываются отдельной строкой — цифры никогда не складываются в одну.'
                    - generic [ref=e365]:
                        - button "Нужен ли AI, чтобы пользоваться?" [ref=e366] [cursor=pointer]
                        - paragraph [ref=e369]: Нет. Дашборд, цели, воронка, отчёты и выгрузки работают без провайдера. AI добавляет гипотезы, разбор отчёта и ассистента по справке. Провайдера и порядок фолбэка настраивает администратор — можно вообще без AI.
                    - generic [ref=e370]:
                        - button "Откуда данные в разделе «Сейчас»?" [ref=e371] [cursor=pointer]
                        - paragraph [ref=e374]: 'Напрямую из Reporting API Метрики с кэшем 60 секунд. Тестовый трафик отфильтрован: песочницы pc-goals (URL вида file:…), пометки env=test, а роботы отсекаются на уровне настроек счётчика — в цифрах только живые посетители.'
                    - generic [ref=e375]:
                        - button "За какой период доступны данные?" [ref=e376] [cursor=pointer]
                        - paragraph [ref=e379]: 'Синк проходит каждые 3 часа (окно 14 дней), история догружается до года. Все сырые ответы Метрики сохраняются в базу: любая цифра кабинета и отчёта прослеживается до исходного ответа API — ничего «из воздуха».'
                    - generic [ref=e380]:
                        - button "Что происходит, если Метрика недоступна?" [ref=e381] [cursor=pointer]
                        - paragraph [ref=e384]: 'Синк падает безопасно: окно данных сначала сохраняется в памяти и восстанавливается при сбое, поэтому неудачная загрузка не оставляет кабинет с пустыми таблицами. Попытки повторяются с задержкой (например, при исчерпании квоты API), «Сейчас» продолжает работать с кэшем.'
                    - generic [ref=e385]:
                        - button "Что такое гипотеза и как считается ICE?" [ref=e386] [cursor=pointer]
                        - paragraph [ref=e389]: 'Гипотеза — это формат работы с идеей: что делаем, 3 допущения, 2 метода проверки, ICE = Impact × Confidence × Ease, статус и дедлайн. Идеи можно вносить вручную («→ гипотеза» из любого инсайта) или импортировать сгенерированные AI.'
                    - generic [ref=e390]:
                        - button "Как ИИ не выдумывает цифры?" [ref=e391] [cursor=pointer]
                        - paragraph [ref=e394]: 'В промпт уходят только факты среза данных. После генерации каждое число в тексте гипотезы сверяется со срезом: чего нет в данных — помечается предупреждением «непроверенное число». В отчёте указано, какой провайдер и модель делали разбор.'
                    - generic [ref=e395]:
                        - button "Что ИИ видит о наших данных?" [ref=e396] [cursor=pointer]
                        - paragraph [ref=e399]: 'Только агрегаты среза: числа по дням, каналам и целям. Личных данных и сырых логов ИИ не получает. Ключи провайдеров хранятся зашифрованными (AES-256-GCM); если данные не должны покидать РФ-контур — включается GigaChat.'
                    - generic [ref=e400]:
                        - button "Можно ли анализировать в DataLens?" [ref=e401] [cursor=pointer]
                        - paragraph [ref=e404]: Да. Дашборд «Трафик и цели» в DataLens собирается автоматически (визиты, источники, заказы), типизированные CSV выгружаются для подключения «Файлы», а вебхуки DataLens приходят обратно в кабинет.
                    - generic [ref=e405]:
                        - button "Кто и как управляет доступом?" [ref=e406] [cursor=pointer]
                        - paragraph [ref=e409]: 'Самостоятельной регистрации нет: администратор создаёт аккаунты и выдаёт временный пароль, аналитик меняет его при первом входе. Роли проверяются на сервере: админ настраивает интеграции и ключи, аналитик работает с данными, отчётами и гипотезами.'
                    - generic [ref=e410]:
                        - button "А если данные Метрики и кабинета расходятся?" [ref=e411] [cursor=pointer]
                        - paragraph [ref=e414]: 'Все запросы синка воспроизводимы: те же фильтры, атрибуция по последнему значимому источнику, запросы по-дневные. Есть скрипт сверки «Метрика ↔ база ↔ API ↔ CSV ↔ отчёт ↔ DataLens» — расхождение считается багом, а не особенностью.'
                    - generic [ref=e415]:
                        - button "Что нужно для старта?" [ref=e416] [cursor=pointer]
                        - paragraph [ref=e419]: OAuth-доступ к счётчику Метрики и аккаунт от администратора — остальное кабинет подтянет сам. AI-провайдер (10 минут в настройках) и DataLens подключаются опционально; деплой — скриптом на любой VPS с HTTPS.
