<!doctype html>
<html lang="ru" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0B0F1A" />
    <meta
      name="description"
      content="ProductCamp Analytics Copilot — данные Яндекс.Метрики, воронка заявка → заказ → оплата, AI-гипотезы и отчёты DOCX/PDF для команды ProductCamp."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta property="og:title" content="ProductCamp Analytics Copilot" />
    <meta
      property="og:description"
      content="Аналитика ProductCamp на данных Яндекс.Метрики: воронка заявка → заказ → оплата, AI-гипотезы роста и готовые отчёты DOCX/PDF."
    />
    <meta property="og:url" content="https://dashboardcamp.ru" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://dashboardcamp.ru/screenshots/03-overview.png" />
    <meta property="og:locale" content="ru_RU" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ProductCamp Analytics Copilot" />
    <meta
      name="twitter:description"
      content="Аналитика ProductCamp на данных Яндекс.Метрики: воронка заявка → заказ → оплата, AI-гипотезы роста и готовые отчёты DOCX/PDF."
    />
    <meta name="twitter:image" content="https://dashboardcamp.ru/screenshots/03-overview.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- ANA-41: Google Fonts не в критическом пути — preload + неблокирующая подмена media,
         иначе рендер ждёт ~1s цепочку css2 → woff2. Fallback в noscript для без-JS клиентов. -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <title>ProductCamp Analytics Copilot</title>
    <script>
      // Apply theme + language before first paint (no flash). Values: localStorage → system.
      (function () {
        try {
          var t = localStorage.getItem('pca.theme');
          if (t !== 'light' && t !== 'dark') {
            t =
              window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark';
          }
          document.documentElement.setAttribute('data-theme', t);
          var l = localStorage.getItem('pca.locale');
          if (l === 'en' || l === 'ru') document.documentElement.setAttribute('lang', l);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
