<!doctype html>
<html lang="ru" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="ProductCamp Analytics Copilot — данные Яндекс.Метрики, воронка заявка → заказ → оплата, AI-гипотезы и отчёты DOCX/PDF для команды ProductCamp."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23000'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23ff4d14' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%23ff4d14'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>ProductCamp Analytics Copilot</title>
    <script>
      // Apply theme + language before first paint (no flash). Values: localStorage → system.
      (function () {
        try {
          var t = localStorage.getItem('pca.theme');
          if (t !== 'light' && t !== 'dark') {
            t =
              window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark';
          }
          document.documentElement.setAttribute('data-theme', t);
          var l = localStorage.getItem('pca.locale');
          if (l === 'en' || l === 'ru') document.documentElement.setAttribute('lang', l);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
