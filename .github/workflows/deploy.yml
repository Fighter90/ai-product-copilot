# CI/CD: Continuous Delivery на прод (dashboardcamp.ru) по образцу career-ops-ui:
# тег v*.*.* → гейты → rsync-деплой проверенным deploy/deploy.sh → GitHub Deployment
# (environment "production") со статусами → GitHub Release.
#
# Требуемые секреты репозитория (Settings → Secrets and variables → Actions):
#   DEPLOY_SSH_KEY — приватный SSH-ключ деплой-пользователя сервера (one line per \n).
#   DEPLOY_HOST    — user@host сервера, напр. root@5.129.219.145.
name: Deploy (production)

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch: {}

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: write # GitHub Release
  deployments: write # GitHub Deployments statuses

jobs:
  gates:
    name: Gates · format · lint · typecheck · tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: Format check
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Typecheck (all packages)
        run: pnpm typecheck
      - name: Tests · backend
        run: pnpm --filter @pca/backend test
      - name: Tests · frontend
        run: pnpm --filter @pca/frontend test
      - name: Tests · shared
        run: pnpm --filter @pca/shared test

  deploy:
    name: Deploy → production (dashboardcamp.ru)
    needs: gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://dashboardcamp.ru
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # deploy.sh читает git rev-parse для BUILD_SHA

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # deploy.sh собирает фронтенд локально (на сервере мало RAM) и rsync-ает артефакты.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start GitHub Deployment (in_progress)
        id: deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ID=$(gh api "repos/${{ github.repository }}/deployments" \
            -F ref="${{ github.sha }}" \
            -f task=deploy \
            -f environment=production \
            -F auto_merge=false \
            -F 'required_contexts[]' \
            --jq '.id')
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          gh api "repos/${{ github.repository }}/deployments/$ID/statuses" \
            -f state=in_progress \
            -f log_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Write SSH key
        run: |
          install -m 600 /dev/null deploy_key
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > deploy_key

      - name: Run deploy.sh
        env:
          SSH_KEY: ${{ github.workspace }}/deploy_key
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
        run: ./deploy/deploy.sh

      - name: Health check (prod)
        run: |
          for i in 1 2 3 4 5; do
            if curl -fsS https://dashboardcamp.ru/api/health | tee /tmp/health.json | grep -q '"status":"ok"'; then
              echo "health OK"; cat /tmp/health.json; exit 0
            fi
            sleep 10
          done
          echo "health check failed"; cat /tmp/health.json 2>/dev/null; exit 1

      - name: Finish GitHub Deployment (success)
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/deployments/${{ steps.deployment.outputs.id }}/statuses" \
            -f state=success \
            -f environment=production \
            -f environment_url=https://dashboardcamp.ru \
            -f log_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Finish GitHub Deployment (failure)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/deployments/${{ steps.deployment.outputs.id }}/statuses" \
            -f state=failure \
            -f environment=production \
            -f log_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            || true

  release:
    name: GitHub Release
    needs: deploy
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists"
          else
            gh release create "$TAG" --generate-notes --title "$TAG"
          fi
