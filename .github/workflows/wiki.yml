# ANA-74/автоматизация: публикация docs/wiki → GitHub Wiki.
# Триггеры: изменение docs/wiki/** на main или ручной запуск.
# Первая инициализация: один раз создать любую страницу в интерфейсе
# (https://github.com/Fighter90/ai-product-copilot/wiki/_new) — дальше этот воркфлоу
# синхронизирует вики автоматически (scripts/publish-wiki.sh --push).
name: Wiki

on:
  push:
    branches: [main]
    paths:
      - 'docs/wiki/**'
      - '.github/workflows/wiki.yml'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: wiki
  cancel-in-progress: false

jobs:
  publish:
    name: Publish docs/wiki → GitHub Wiki
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Токен в URL — для push в приватный <repo>.wiki.git.
          WIKI_GIT_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/Fighter90/ai-product-copilot.wiki.git
        run: |
          git config --global user.name 'pca-wiki-bot'
          git config --global user.email 'actions@github.com'
          scripts/publish-wiki.sh --push
