name: E2E
on:
  workflow_dispatch: {}
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # chromium — единственный движок: desktop-проект и mobile-iphone-14 (iPhone 14-профиль на
      # chromium, ANA-146 — webkit больше не используется ни одним проектом).
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
