# Разовая ops-задача (ANA-115): восстановление документированных паролей
# демо-аккаунтов на проде dashboardcamp.ru через SSH (как в deploy.yml, без checkout).
#
# Требуемые секреты репозитория:
#   DEPLOY_SSH_KEY          — приватный SSH-ключ (как для деплоя).
#   DEPLOY_HOST             — user@host сервера (root@5.129.219.145).
#   DEMO_ADMIN_PASSWORD     — новый пароль admin@dashboardcamp.ru.
#   DEMO_ANALYST_PASSWORD   — новый пароль analyst@dashboardcamp.ru.
#
# Пароли НИКОГДА не печатаются в лог: наружу идут только http-коды логинов.
name: Admin ops (one-off)

on:
  workflow_dispatch: {}

concurrency:
  group: admin-ops
  cancel-in-progress: false

jobs:
  restore-demo-passwords:
    name: ANA-115 · restore documented demo passwords (prod)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Write SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 600 /dev/null deploy_key
          printf '%s\n' "$DEPLOY_SSH_KEY" > deploy_key

      - name: Restore demo passwords on prod
        env:
          SSH_KEY: ${{ github.workspace }}/deploy_key
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          DEMO_ADMIN_PASS: ${{ secrets.DEMO_ADMIN_PASSWORD }}
          DEMO_ANALYST_PASS: ${{ secrets.DEMO_ANALYST_PASSWORD }}
        run: |
          ssh -p 22 -i "$SSH_KEY" -o StrictHostKeyChecking=accept-new "$SSH_HOST" "DEMO_ADMIN_PASS=$(printf '%q' "$DEMO_ADMIN_PASS") DEMO_ANALYST_PASS=$(printf '%q' "$DEMO_ANALYST_PASS") bash -s" <<'REMOTE'
          set -Eeuo pipefail
          cat > /tmp/set-demo-pass.mts <<'TS'
          import { createRequire } from 'node:module';
          import { randomBytes, scryptSync } from 'node:crypto';

          // Скрипт лежит в /tmp: без createRequire ESM не найдёт better-sqlite3,
          // поэтому резолвим модули относительно /opt/pca/backend.
          const require = createRequire('/opt/pca/backend/package.json');
          const Database = require('better-sqlite3');

          const SCRYPT_N = 16384;
          const SCRYPT_KEYLEN = 64;
          const hashPassword = (password, salt = randomBytes(16)) => {
            const hash = scryptSync(password, salt, SCRYPT_KEYLEN, { N: SCRYPT_N });
            return `scrypt$${SCRYPT_N}$${salt.toString('base64')}$${hash.toString('base64')}`;
          };

          const DEMOS = ['admin@dashboardcamp.ru', 'analyst@dashboardcamp.ru'];
          const passwords = new Map([
            [DEMOS[0], process.env.DEMO_ADMIN_PASS ?? ''],
            [DEMOS[1], process.env.DEMO_ANALYST_PASS ?? ''],
          ]);
          for (const email of DEMOS) {
            if (!passwords.get(email)) throw new Error(`password for ${email} is empty`);
          }

          const db = new Database('/opt/pca/data/productcamp.sqlite');
          db.pragma('busy_timeout = 10000');
          try {
            const update = db.prepare(
              `UPDATE users SET password_hash = ? WHERE email = ?`,
            );
            for (const email of DEMOS) {
              const info = update.run(hashPassword(passwords.get(email)), email);
              if (info.changes !== 1) {
                throw new Error(`${email}: updated ${info.changes} rows, expected 1`);
              }
            }
            const revoked = db
              .prepare(
                `DELETE FROM sessions WHERE user_id IN (SELECT id FROM users WHERE email IN (${DEMOS.map(() => '?').join(', ')}))`,
              )
              .run(...DEMOS);
            console.log(`sessions revoked: ${revoked.changes}`);
            // Подтверждение БЕЗ хэшей.
            const rows = db
              .prepare(
                `SELECT email, role FROM users WHERE email IN (${DEMOS.map(() => '?').join(', ')}) ORDER BY email`,
              )
              .all(...DEMOS);
            console.log('users:', JSON.stringify(rows));
          } finally {
            db.close();
          }
          TS
          cd /opt/pca/backend
          DEMO_ADMIN_PASS="$DEMO_ADMIN_PASS" DEMO_ANALYST_PASS="$DEMO_ANALYST_PASS" tsx /tmp/set-demo-pass.mts
          # Логин-проверка: печатаем ТОЛЬКО http-код, пароли не выводим.
          login_code() {
            body=$(printf '{"email":"%s","password":"%s"}' "$1" "$2")
            curl -s -o /dev/null -w '%{http_code}' --max-time 15 -X POST http://127.0.0.1:4000/api/auth/login -H 'content-type: application/json' -d "$body"
          }
          echo "admin login http:   $(login_code admin@dashboardcamp.ru "$DEMO_ADMIN_PASS")"
          echo "analyst login http: $(login_code analyst@dashboardcamp.ru "$DEMO_ANALYST_PASS")"
          rm -f /tmp/set-demo-pass.mts
          REMOTE

      - name: Cleanup SSH key
        if: always()
        run: rm -f deploy_key
