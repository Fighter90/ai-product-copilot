# Конфиг nginx для dashboardcamp.ru (PCA frontend static + /api proxy).
# SSL-версия: сертификаты Let's Encrypt (certbot), HTTP -> HTTPS redirect.
# Обновление сертификата: certbot renew (systemd timer) — reload через deploy hook.
# Rate-limit: зоны pca_login (10r/m) и pca_api (120r/m) объявлены в
# /etc/nginx/conf.d/pca-ratelimit.conf (в репо — deploy/nginx-ratelimit.conf).
# Директива limit_req_zone допустима только на уровне http, поэтому зоны живут
# отдельным файлом в conf.d, а этот site-конфиг подключается внутрь http
# и только ссылается на зоны через limit_req в нужных location.

# --- HTTP (порт 80): только ACME-challenge + редирект на HTTPS ---------------------------
server {
    listen 80;
    listen [::]:80;
    server_name dashboardcamp.ru www.dashboardcamp.ru;

    # Каталог для certbot webroot (создаётся в setup-server.sh)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://dashboardcamp.ru$request_uri;
    }
}

# --- HTTPS (порт 443): приложение --------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name dashboardcamp.ru www.dashboardcamp.ru;

    ssl_certificate     /etc/letsencrypt/live/dashboardcamp.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dashboardcamp.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # --- Security-заголовки ---------------------------------------------------------------
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- Gzip: текстовые форматы, которые реально сжимаются -------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml application/xml+rss image/svg+xml;

    # Ограничение тела запроса (бэкенд сам держит bodyLimit 2M — синхронизируем).
    client_max_body_size 2m;

    root /opt/pca/frontend/dist;
    index index.html;

    # --- Хэшированные ассеты Vite: кэш на год, immutable ----------------------------------
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # --- API проксируем на Fastify (127.0.0.1:4000) ----------------------------------------
    location /api/ {
        # Анти-флуд: 120r/m + burst 240 nodelay (зона pca_api из conf.d/pca-ratelimit.conf).
        # Пропускает короткие пачки обычной работы UI, режет только устойчивый поток.
        limit_req zone=pca_api burst=240 nodelay;

        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        # Бэкенд запускается с TRUST_PROXY=1 и корректно видит реальный IP/протокол.

        # LLM-отчёты и синк через /api могут думать дольше минуты:
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
        # 429 (а не дефолтный 503): клиент отличает лимит от падения бэкенда и не разлогинивает.
        limit_req_status 429;
    }

    # --- Отчёты: AI-анализ/гипотезы (несколько LLM-вызовов) — запас по таймауту -------------
    location ^~ /api/report/ {
        limit_req zone=pca_api burst=240 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_connect_timeout 10s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
    }

    # --- Логин: жёсткий анти-брутфорс --------------------------------------------------------
    # 10r/m = 1 запрос/6 сек на IP, burst 5 nodelay: первые 6 подряд проходят,
    # дальше nginx отдаёт 503, пока окно не "отпустит". Точное совпадение (=)
    # приоритетнее префикса /api/ независимо от порядка location.
    # limit_req_status не задан — дефолт 503 (семантика nginx "too many requests").
    location = /api/auth/login {
        limit_req zone=pca_login burst=5 nodelay;

        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        # Бэкенд запускается с TRUST_PROXY=1 и корректно видит реальный IP/протокол.

        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }

    # --- SPA: index.html без кэша (чтобы деплой подхватывался сразу) -----------------------
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Скрытые файлы (кроме ACME) запрещены: .env, .git и пр. отдают 403/404.
    location ~ /\.(?!well-known) {
        deny all;
    }
}
