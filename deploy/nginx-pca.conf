# Конфиг nginx для dashboardcamp.ru (PCA frontend static + /api proxy).
# Установка: cp deploy/nginx-pca.conf /etc/nginx/sites-available/pca.conf
#            ln -sf /etc/nginx/sites-available/pca.conf /etc/nginx/sites-enabled/
#            rm -f /etc/nginx/sites-enabled/default && nginx -t && systemctl reload nginx
#
# SSL выдаётся после первого деплоя: certbot --nginx -d dashboardcamp.ru -d www.dashboardcamp.ru
# certbot сам добавит listen 443 ssl + сертификаты и редирект 80 -> 443 в этот файл.

# --- HTTP (порт 80): ACME-webroot для certbot + приложение до появления SSL -------------
server {
    listen 80;
    listen [::]:80;
    server_name dashboardcamp.ru www.dashboardcamp.ru;

    # Каталог для certbot webroot (создаётся в setup-server.sh)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    # --- Security-заголовки (общие для всех location без собственных add_header) ---------
    # HSTS включаем ТОЛЬКО после выпуска SSL-сертификата (раскомментировать, затем reload nginx):
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- Gzip: текстовые форматы, которые реально сжимаются ------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml application/xml+rss image/svg+xml;

    # Ограничение тела запроса (бэкенд сам держит bodyLimit 2M — синхронизируем).
    client_max_body_size 2m;

    root /opt/pca/frontend/dist;
    index index.html;

    # --- Хэшированные ассеты Vite: кэш на год, immutable ---------------------------------
    # (Свои add_header => серверные security-заголовки здесь не наследуются; для
    #  некэшируемых css/js-ассетов это допустимо — они не рендерятся как документ.)
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # --- API проксируем на Fastify (127.0.0.1:4000) --------------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        # Fastify собран с trustProxy: true и корректно видит реальный IP/протокол.

        # LLM-отчёты и синк через /api могут думать дольше минуты:
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }

    # --- SPA: index.html без кэша (чтобы деплой подхватывался сразу) ---------------------
    # = /index.html и / получают no-cache; остальные пути — fallback на index.html
    # (react-router обслуживает адреса на клиенте).
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Мелочи: favicon/manifest отдаются как есть (try_files выше), 404 для скрытых файлов.
    location ~ /\.(?!well-known) {
        deny all;
    }
}

# ПРИМЕЧАНИЕ: 443-сервер здесь не прописан намеренно — его создаст certbot --nginx,
# скопировав этот блок и добавив ssl_certificate. После certbot проверьте файл:
#   nginx -t && systemctl reload nginx
# и раскомментируйте HSTS выше.
