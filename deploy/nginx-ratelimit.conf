# Rate-limit зоны для PCA nginx (dashboardcamp.ru).
# Установка: скопировать в /etc/nginx/conf.d/pca-ratelimit.conf, затем nginx -t && systemctl reload nginx.
# Файл обязан жить в conf.d: директива limit_req_zone допустима только на уровне http,
# а deploy/nginx-pca.conf подключается внутрь http как site-конфиг (sites-enabled).

# Логин: 10 запросов в минуту (1 запрос / 6 сек) на IP — защита от брутфорса паролей.
limit_req_zone $binary_remote_addr zone=pca_login:10m rate=10r/m;

# Остальное API: 120 запросов в минуту на IP — мягкий анти-флуд, не мешает обычной работе.
limit_req_zone $binary_remote_addr zone=pca_api:10m rate=120r/m;
