# Security-заголовки PCA (ANA-52). Подключается из deploy/nginx-pca.conf:
#   include /etc/nginx/snippets/pca-security-headers.conf;
# на уровне server и ВНУТРИ location, где есть свои add_header (Cache-Control),
# т.к. nginx наследует add_header с верхнего уровня только при полном их
# отсутствии на текущем уровне. Один файл = одна точка правды для CSP-хеша.
#
# Установка на сервере: setup-server.sh / deploy.sh кладут файл в
# /etc/nginx/snippets/pca-security-headers.conf.

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
# CSP (ANA-52). Что реально использует SPA (проверено по code/frontend/index.html
# и собранному dist, violations тест — deploy/DEPLOY.md «CSP»):
#   • инлайновый <script> в index.html (тема/язык до первой отрисовки)
#     — разрешен точным SHA-256 хешем; если поменять байт — браузер заблокирует,
#       новый хеш берём из dist и обновляем здесь;
#   • шрифты Google Fonts: <link href=fonts.googleapis.com/...> (style-src)
#     и сами woff2 с fonts.gstatic.com (font-src);
#   • инлайновые style-атрибуты React → style-src 'unsafe-inline';
#   • data:image в собранных ассетах echarts → img-src data:;
#   • экспорт CSV через blob:-URL (<a download>) — навигации CSP не блокирует,
#     отдельного правила не нужно.
# Метрика (mc.yandex.ru) ходит только с бэкенда (server-side sync) — в CSP не открыта.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-VF/Y2ldNjz3O8jmS5UBsdTxcZYb8cV0r1yr3pYZ9y34='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; manifest-src 'self'; worker-src 'self';" always;
